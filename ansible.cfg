# ansible.cfg
# Ansible configuration for this project.
# Ansible checks this directory first, so this file takes effect
# for anyone who clones this repo without touching their system config.

[defaults]
inventory           = inventory/hosts.yml
roles_path          = roles
# host_key_checking verifies the SSH host key of every device before
# connecting. Keeps this True — setting it False is a common shortcut
# that opens you up to man-in-the-middle attacks.
host_key_checking   = True
retry_files_enabled = False
stdout_callback     = default
result_format       = yaml

# privilege_escalation (sudo) is not configured here because this repo
# manages network devices running RouterOS, not Linux systems.
# RouterOS has no sudo — you log in directly as an admin user.
# When Linux hosts are added to this repo, escalation settings
# will be configured per role using become: true at the task level.
