---
# inventory/hosts.yml
# Define your hosts and groups here.
# See: https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html

all:
  hosts:
    mikrotik:
      # SSH is restricted to address=10.30.10.22/32 on the MikroTik service.
      # This means SSH only accepts connections arriving on the inside interface.
      # Ansible must connect via the inside interface IP (10.30.10.1) not the
      # outside interface (10.30.1.3) even though 10.30.1.3 is the management IP.
      ansible_host: 10.30.10.1
      ansible_connection: ansible.netcommon.network_cli
      ansible_network_os: community.routeros.routeros
      # TODO: team to agree on a standardized service account name
      # for all network devices rather than personal user accounts.
      ansible_user: b.plunko
      ansible_password: "{{ mikrotik_admin_password }}"
      ansible_command_timeout: 60
