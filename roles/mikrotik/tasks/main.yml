---
# roles/mikrotik/tasks/main.yml
# Read-only verification role — lists current firewall filter rules and
# asserts that all nine baseline rules are present by checking their comments.
# This role makes no changes to the router.
#
# community.routeros.command is used intentionally here over the API module
# because this role only reads output. The API module is better suited for
# making changes. Using command keeps this role simple and easy to debug.
#
# NOTE: community.routeros.command skips during --check mode since it cannot
# simulate router commands. Run without --check to actually verify rules.

- name: Read current firewall filter rules
  community.routeros.command:
    commands:
      - /ip firewall filter print terse
  register: mikrotik_fw_filter

- name: Show firewall filter rules
  ansible.builtin.debug:
    var: mikrotik_fw_filter.stdout_lines

- name: Check baseline rule comments are present
  ansible.builtin.assert:
    that:
      - "'input:established/related' in mikrotik_fw_filter.stdout[0]"
      - "'input:drop invalid' in mikrotik_fw_filter.stdout[0]"
      - "'input:allow ping' in mikrotik_fw_filter.stdout[0]"
      - "'input: ssh and winbox from linux segment' in mikrotik_fw_filter.stdout[0]"
      - "'input:default deny' in mikrotik_fw_filter.stdout[0]"
      - "'forward:established/related' in mikrotik_fw_filter.stdout[0]"
      - "'forward:drop invalid' in mikrotik_fw_filter.stdout[0]"
      - "'forward: Linux segment outbound' in mikrotik_fw_filter.stdout[0]"
      - "'forward: default deny' in mikrotik_fw_filter.stdout[0]"
    fail_msg: "A baseline rule is missing or renamed. Compare with /ip firewall filter print on the router."
    success_msg: "All nine baseline rules are present"
