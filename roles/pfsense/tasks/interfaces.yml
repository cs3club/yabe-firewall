---
- name: Configure outside and inside interfaces
  pfsensible.core.pfsense_interface:
    descr: "{{ item.descr }}"
    interface: "{{ item.interface }}"
    enable: true
    ipv4_type: static
    ip_address: "{{ item.ip }}"
    subnet: "{{ item.prefix }}"
    blockpriv: "{{ item.blockpriv }}"
    blockbogons: "{{ item.blockbogons }}"
    state: present
  loop: "{{ pf_interfaces }}"
