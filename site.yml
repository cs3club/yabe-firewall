---
# site.yml
# Master playbook — entry point for everything.
# Run with:
#   ansible-playbook site.yml --check --diff   (dry run first, always)
#   ansible-playbook site.yml                  (apply)
#   ansible-playbook site.yml --tags <tag>     (run one role only)

- name: Yabe range firewall devices
  hosts: all
  # gather_facts: false is required for network devices running RouterOS.
  # Ansible's fact gathering module targets Linux systems and will fail
  # on MikroTik. This applies to all network devices in this repo —
  # VyOS, pfSense, and the Debian router will each handle facts differently
  # when their roles are added.
  gather_facts: false
  roles:
    - role: mikrotik
      tags: mikrotik
    - role: mikrotik_lockdown
      tags: mikrotik-lockdown
