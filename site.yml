---
# site.yml
# Master playbook — entry point for everything.
# Run with:
#   ansible-playbook site.yml --check --diff   (dry run first, always)
#   ansible-playbook site.yml                  (apply)
#   ansible-playbook site.yml --tags <tag>     (run one role only)

- name: pfSense firewall
  hosts: pfsense
  become: false
  gather_facts: false
  vars_files:
    - vars/main.yml
    - vars/secrets.yml
  roles:
    - role: pfsense
      tags: pfsense
